services:
  herb:
    image: herb-qa:local
    build:
      context: .
      target: ${HERB_IMAGE_TARGET:-runtime}
    ports:
      - "127.0.0.1:7861:7860"
    volumes:
      - herb-config:/app/config
      - herb-store:/app/store
      - ./data:/app/data:ro
    restart: unless-stopped

volumes:
  herb-config:
  herb-store:
