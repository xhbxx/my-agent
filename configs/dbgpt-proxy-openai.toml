[system]
language = "${env:DBGPT_LANG:-zh}"
encrypt_key = "${env:DATA_AGENT_ENCRYPT_KEY}"

[service.web]
host = "127.0.0.1"
port = 5670
cors_allowed_origins = "http://localhost:5670,http://127.0.0.1:5670"

[service.web.database]
type = "sqlite"
path = "pilot/meta_data/dbgpt.db"

[rag.storage.vector]
type = "chroma"
persist_path = "pilot/data"

[[models.llms]]
name = "${env:LLM_MODEL_NAME:-gpt-4o-mini}"
provider = "proxy/openai"
api_base = "${env:LLM_MODEL_API_BASE:-https://api.openai.com/v1}"
api_key = "${env:LLM_MODEL_API_KEY}"

[[models.embeddings]]
name = "${env:EMBEDDING_MODEL_NAME:-text-embedding-3-small}"
provider = "proxy/openai"
api_url = "${env:EMBEDDING_MODEL_API_URL:-https://api.openai.com/v1/embeddings}"
api_key = "${env:EMBEDDING_MODEL_API_KEY}"
