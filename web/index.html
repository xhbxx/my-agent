<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中医养生科普助手</title>
<style>
:root {
  --paper: #F5F0E4; --paper-dim: #EFE8D7; --surface: #FFFFFF;
  --ink: #1B1A17; --ink-soft: #4A4640; --mist: #8C857A;
  --vermillion: #A53420; --vermillion-soft: #F3E1DA;
  --jade: #2F6B5A; --jade-soft: #DCEAE3;
  --loam: #8C5A2B; --loam-soft: #F2E6D0;
  --hairline: #D9D0BC; --hover: #E5DDD0;
  --danger: #B91C1C; --danger-light: #FEE2E2;
  --warning: #92400E; --warning-light: #FEF3C7;
  --info: #1E40AF; --info-light: #EFF6FF;
  --radius: 10px; --radius-sm: 6px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--paper); color: var(--ink); font-size: 15px;
  display: flex; overflow: hidden; line-height: 1.7;
}

/* Sidebar */
#sidebar {
  width: 260px; min-width: 260px; background: var(--paper-dim);
  border-right: 1px solid var(--hairline); display: flex; flex-direction: column;
}
.side-head {
  padding: 18px 14px 16px; border-bottom: 1px solid var(--hairline);
  display: flex; align-items: center; gap: 10px;
}
.side-head .logo {
  width: 32px; height: 32px; border-radius: var(--radius-sm);
  background: var(--vermillion); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 700; flex-shrink: 0;
  font-family: "Noto Serif SC", "Songti SC", "SimSun", serif;
}
.side-head b {
  font-size: 14px; font-weight: 700; color: var(--ink);
  font-family: "Noto Serif SC", "Songti SC", "SimSun", serif;
}

#btn-new {
  margin: 12px 12px 8px; padding: 9px;
  border: 1px solid var(--hairline); border-radius: var(--radius);
  background: var(--surface); color: var(--ink);
  font-size: 13.5px; cursor: pointer; font-family: inherit;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  transition: all .15s; font-weight: 600;
}
#btn-new:hover { border-color: var(--jade); color: var(--jade); }

#btn-manage {
  margin: 0 12px 8px; padding: 6px;
  border: none; border-radius: var(--radius-sm);
  background: none; color: var(--mist);
  font-size: 12px; cursor: pointer; font-family: inherit;
}
#btn-manage:hover { background: var(--hover); color: var(--ink); }

#conv-list {
  flex: 1; overflow-y: auto; padding: 4px 8px 10px;
}
.group-label {
  font-size: 11px; color: var(--mist); padding: 10px 10px 4px;
  font-weight: 600; letter-spacing: .05em;
  font-family: "Noto Serif SC", "Songti SC", "SimSun", serif;
}
.conv-item {
  display: flex; align-items: center; padding: 8px 10px;
  border-radius: var(--radius-sm); cursor: pointer;
  color: var(--ink); margin-bottom: 2px; position: relative;
  transition: all .15s;
}
.conv-item:hover { background: var(--hover); }
.conv-item.active {
  background: var(--jade-soft); color: var(--jade);
  border-left: 3px solid var(--jade);
}
.conv-item .pin-ico { margin-right: 5px; font-size: 11px; opacity: .7; }
.conv-item .sel-box { margin-right: 8px; flex-shrink: 0; display: none; }
body.manage-mode .conv-item .sel-box { display: inline-flex; }
body.manage-mode .conv-ops { display: none !important; }
.conv-title {
  flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-size: 13px;
}
.conv-item.active .conv-title { font-weight: 600; }
.conv-ops { display: none; gap: 2px; flex-shrink: 0; }
.conv-item:hover .conv-ops { display: flex; }
.conv-ops button {
  border: none; background: none; cursor: pointer;
  font-size: 12px; padding: 2px 5px; border-radius: 4px; color: var(--mist);
}
.conv-ops button:hover { background: rgba(0,0,0,.06); color: var(--ink); }
.conv-ops button.del:hover { color: var(--danger); }
.rename-input {
  flex: 1; font-size: 13px; border: 1px solid var(--jade);
  border-radius: 5px; padding: 2px 6px; outline: none; min-width: 0;
  background: #fff; font-family: inherit;
}

#manage-bar {
  display: none; padding: 10px 12px; border-top: 1px solid var(--hairline);
  background: var(--paper-dim); gap: 8px;
}
body.manage-mode #manage-bar { display: flex; }
#manage-bar button {
  flex: 1; padding: 7px 0; border-radius: var(--radius-sm);
  font-size: 12.5px; cursor: pointer;
  border: 1px solid var(--hairline); background: var(--surface);
  color: var(--ink-soft); font-family: inherit;
}
#manage-bar button:disabled { opacity: .4; cursor: not-allowed; }
#manage-bar .btn-batch-del {
  border-color: #fca5a5; color: var(--danger);
}
#manage-bar .btn-batch-del:not(:disabled):hover {
  background: var(--danger-light);
}

.side-foot {
  padding: 12px 14px; border-top: 1px solid var(--hairline);
}
.side-foot a {
  display: block; font-size: 13px; color: var(--jade);
  text-decoration: none; font-weight: 600; padding: 6px 8px;
  border-radius: var(--radius-sm); transition: background .12s;
  font-family: "Noto Serif SC", "Songti SC", "SimSun", serif;
}
.side-foot a:hover { background: var(--jade-soft); }

/* Main */
#main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

#chat-scroll { flex: 1; overflow-y: auto; }
#chat-inner {
  max-width: 820px; margin: 0 auto;
  padding: 32px 24px 20px;
  display: flex; flex-direction: column; gap: 24px;
}

/* Welcome */
#welcome { text-align: center; padding: 50px 20px 30px; }
.big-logo {
  width: 64px; height: 64px; border-radius: var(--radius);
  background: var(--vermillion); color: #fff;
  font-size: 28px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 18px;
  font-family: "Noto Serif SC", "Songti SC", "SimSun", serif;
  letter-spacing: .1em;
}
#welcome h1 {
  font-size: 28px; font-weight: 700; color: var(--ink);
  margin-bottom: 10px; letter-spacing: .05em;
  font-family: "Noto Serif SC", "Songti SC", "SimSun", serif;
}
#welcome p {
  color: var(--ink-soft); font-size: 14px; line-height: 1.8;
  max-width: 480px; margin: 0 auto 24px;
}

#agent-entry {
  display: flex; align-items: center; gap: 14px;
  max-width: 540px; margin: 0 auto 24px;
  padding: 16px 20px; border-radius: var(--radius);
  cursor: pointer; text-align: left;
  background: var(--jade); color: #fff;
  border: none; box-shadow: 0 4px 16px rgba(47,107,90,.20);
  transition: all .15s; width: 100%;
}
#agent-entry:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 20px rgba(47,107,90,.28);
}
#agent-entry .ico {
  font-size: 28px; flex-shrink: 0;
}
#agent-entry .t1 {
  font-size: 15px; font-weight: 700; margin-bottom: 3px;
  font-family: "Noto Serif SC", "Songti SC", "SimSun", serif;
}
#agent-entry .t2 {
  font-size: 12.5px; opacity: .85; line-height: 1.5;
}
#agent-entry .go {
  margin-left: auto; font-size: 22px; opacity: .7; flex-shrink: 0;
}

.samples {
  display: flex; flex-direction: column; gap: 8px;
  max-width: 540px; margin: 0 auto;
  counter-reset: sample;
}
.sample {
  border: 1px solid var(--hairline); border-radius: var(--radius-sm);
  padding: 10px 14px; cursor: pointer; font-size: 13.5px;
  color: var(--ink); text-align: left; background: var(--surface);
  transition: all .15s; font-family: inherit;
  display: flex; align-items: baseline; gap: 8px;
}
.sample::before {
  counter-increment: sample;
  content: counter(sample, cjk-ideographic) "、";
  color: var(--vermillion); font-weight: 600; flex-shrink: 0;
  font-family: "Noto Serif SC", "Songti SC", "SimSun", serif;
}
.sample:hover {
  border-color: var(--jade); color: var(--jade);
  background: var(--jade-soft);
}

/* Messages */
.msg-user {
  display: flex; justify-content: flex-end;
  align-items: flex-end; gap: 8px;
}
.msg-user .bubble {
  background: var(--vermillion-soft);
  border-left: 3px solid var(--vermillion);
  padding: 10px 14px; max-width: 76%;
  white-space: pre-wrap; line-height: 1.65;
  font-size: 14.5px; color: var(--ink);
  border-radius: 0 var(--radius-sm) var(--radius-sm) var(--radius-sm);
}

.msg-ai {
  display: flex; gap: 12px; align-items: flex-start;
}
.msg-ai .avatar {
  width: 32px; height: 32px; border-radius: var(--radius-sm);
  background: var(--vermillion); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 700; flex-shrink: 0;
  font-family: "Noto Serif SC", "Songti SC", "SimSun", serif;
}
.msg-ai .body {
  flex: 1; min-width: 0; line-height: 1.8;
  font-size: 14.5px; color: var(--ink);
  border-left: 1px solid var(--hairline);
  padding-left: 14px;
}
.msg-ai .body p { margin-bottom: 8px; }
.msg-ai .body ul, .msg-ai .body ol { margin: 4px 0 10px 20px; }
.msg-ai .body li { margin-bottom: 4px; }
.msg-ai .body strong { color: var(--ink); font-weight: 600; }
.msg-ai .body h3 {
  font-size: 15px; margin: 12px 0 6px; font-weight: 700;
  font-family: "Noto Serif SC", "Songti SC", "SimSun", serif;
}

.msg-ops {
  display: flex; gap: 6px; margin-top: 8px;
  opacity: 0; transition: opacity .15s;
}
.msg-user:hover .msg-ops,
.msg-ai:hover .msg-ops { opacity: 1; }
.msg-ops button {
  border: 1px solid var(--hairline); background: var(--surface);
  color: var(--ink-soft); font-size: 11.5px;
  border-radius: 4px; padding: 3px 10px; cursor: pointer;
  font-family: inherit; transition: all .12s;
}
.msg-ops button:hover {
  color: var(--jade); border-color: var(--jade);
  background: var(--jade-soft);
}

/* Think */
details.think {
  margin-bottom: 10px; border: 1px solid var(--hairline);
  border-radius: var(--radius-sm); background: var(--surface);
  overflow: hidden; font-size: 12.5px;
}
details.think summary {
  padding: 7px 12px; cursor: pointer; color: var(--ink-soft);
  user-select: none; list-style: none;
  display: flex; align-items: center; gap: 7px;
}
details.think summary::-webkit-details-marker { display: none; }
details.think summary .chev {
  transition: transform .2s; font-size: 10px;
}
details.think[open] summary .chev { transform: rotate(90deg); }
details.think[open] summary { border-bottom: 1px solid var(--hairline); }
details.think .think-body { padding: 8px 12px; }

.trace {
  border-left: 2px solid var(--jade-soft);
  padding: 2px 0 2px 12px; font-size: 12px;
  color: var(--ink-soft); line-height: 1.9;
}
.trace .ln {
  display: flex; gap: 7px; align-items: baseline; flex-wrap: wrap;
}
.trace .hit { color: var(--jade); }
.trace .miss { color: var(--loam); }
.trace .q { color: var(--mist); font-style: italic; }

/* Sources */
.sources-box {
  margin-top: 12px; border: 1px solid var(--hairline);
  border-radius: var(--radius-sm); overflow: hidden; font-size: 12.5px;
}
.sources-box summary {
  padding: 8px 12px; cursor: pointer; color: var(--ink-soft);
  user-select: none; background: var(--surface);
  transition: color .12s;
}
.sources-box summary:hover { color: var(--jade); }
.sources-box .src-list { padding: 6px 12px 10px; }
.sources-box .src {
  padding: 5px 0; border-bottom: 1px solid var(--hairline);
  display: flex; justify-content: space-between;
  gap: 10px; align-items: center; font-size: 12px;
}
.sources-box .src:last-child { border-bottom: none; }
.src .score {
  color: var(--jade); font-size: 11.5px; flex-shrink: 0;
  font-variant-numeric: tabular-nums;
}
.src .name {
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  color: var(--ink-soft);
}
.src .cred {
  font-size: 10.5px; border-radius: 999px; padding: 1px 6px;
  margin-left: 6px; border: 1px solid; flex-shrink: 0;
}
.src .cred.background {
  color: var(--loam); background: var(--loam-soft);
  border-color: var(--loam);
}
.src .cred.reject {
  color: var(--danger); background: var(--danger-light);
  border-color: var(--danger);
}

/* Safety card */
.safety-card {
  margin-bottom: 14px; border-radius: var(--radius);
  overflow: hidden; border: 2px solid var(--vermillion);
  background: var(--vermillion-soft);
}
.safety-card.medium {
  border-color: var(--loam); background: var(--loam-soft);
}
.safety-card.info {
  border-color: var(--jade); background: var(--jade-soft);
}
.safety-head {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 10px 14px; font-size: 13px; font-weight: 700;
  color: var(--vermillion);
  font-family: "Noto Serif SC", "Songti SC", "SimSun", serif;
}
.safety-card.medium .safety-head { color: var(--loam); }
.safety-card.info .safety-head { color: var(--jade); }
.safety-head .cnt {
  font-weight: 400; color: var(--ink-soft); font-size: 11.5px;
  font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
}

.safety-stop {
  margin: 10px 14px 2px; padding: 9px 12px; border-radius: var(--radius-sm);
  background: var(--danger-light); color: var(--danger);
  font-size: 13px; font-weight: 600; line-height: 1.7;
  border: 1px solid var(--danger);
}
.safety-switch {
  margin: 10px 14px 2px; padding: 9px 12px; border-radius: var(--radius-sm);
  background: var(--info-light); color: var(--info);
  font-size: 12.5px; line-height: 1.75; border: 1px solid var(--info);
}
.safety-switch b { color: var(--info); font-weight: 700; }

.safety-list { padding: 4px 14px 12px; }
.safety-item {
  padding: 8px 0; border-bottom: 1px solid rgba(0,0,0,.08);
}
.safety-item:last-child { border-bottom: none; }
.safety-item .hd {
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
}
.safety-item .nm {
  font-weight: 700; color: var(--ink); font-size: 13.5px;
  font-family: "Noto Serif SC", "Songti SC", "SimSun", serif;
}

.badge {
  font-size: 10.5px; padding: 2px 7px; border-radius: 999px;
  font-weight: 600; border: 1px solid; white-space: nowrap;
}
.badge.high {
  background: var(--danger-light); color: var(--danger);
  border-color: var(--danger);
}
.badge.medium {
  background: var(--warning-light); color: var(--warning);
  border-color: var(--warning);
}
.badge.info {
  background: var(--info-light); color: var(--info);
  border-color: var(--info);
}
.badge.tag {
  background: var(--paper); color: var(--mist); border-color: var(--hairline);
}
.badge.tier-forbid {
  background: var(--danger-light); color: var(--danger);
  border-color: var(--danger);
}
.badge.tier-confirm {
  background: var(--warning-light); color: var(--warning);
  border-color: var(--warning);
}
.badge.tier-not_needed {
  background: var(--paper); color: var(--mist); border-color: var(--hairline);
}
.badge.tier-conditional {
  background: var(--info-light); color: var(--info);
  border-color: var(--info);
}
.badge.tier-ok {
  background: var(--jade-soft); color: var(--jade);
  border-color: var(--jade);
}

.safety-states {
  margin: 10px 14px 0; font-size: 12.5px;
  color: #6B21A8; background: #FAF5FF;
  border-left: 3px solid #A855F7;
  padding: 8px 12px; border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  line-height: 1.75;
}
.safety-states b { color: #581C87; font-weight: 700; }

.safety-item .why {
  color: var(--ink-soft); font-size: 12.5px;
  margin-top: 5px; line-height: 1.7;
}
.safety-item .notfor {
  color: var(--loam); font-size: 12px; margin-top: 3px;
}
.safety-item .cond {
  margin-top: 5px; font-size: 12px; color: var(--ink-soft);
  line-height: 1.7;
}
.safety-item .cond b { color: var(--info); font-weight: 600; }
.safety-item .pending {
  margin-top: 5px; font-size: 12px; color: var(--loam);
  background: var(--loam-soft); border-left: 3px solid var(--loam);
  padding: 5px 10px; border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  line-height: 1.75;
}
.safety-item .reading {
  margin-top: 6px; font-size: 12.5px; color: var(--ink-soft);
  background: var(--paper); border-left: 3px solid var(--hairline);
  padding: 7px 11px; border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  line-height: 1.75;
}
.safety-item .reading b { color: var(--ink); font-weight: 600; }
.safety-item .reading.t-forbid {
  background: var(--danger-light); border-left-color: var(--danger);
  color: var(--danger);
}
.safety-item .reading.t-not_needed {
  background: var(--paper); border-left-color: var(--hairline);
  color: var(--ink-soft);
}
.safety-item .reading.t-conditional {
  background: var(--warning-light); border-left-color: var(--warning);
  color: var(--warning);
}
.safety-item .reading.t-ok {
  background: var(--jade-soft); border-left-color: var(--jade);
  color: var(--jade);
}
.safety-item .verdict {
  margin-top: 6px; font-size: 12.5px; color: var(--loam);
  background: var(--loam-soft); border-left: 3px solid var(--loam);
  padding: 6px 10px; border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  line-height: 1.7;
}

.safety-sub {
  padding: 10px 14px 0; font-size: 12px; color: var(--mist);
  font-weight: 600;
}
.safety-sub + .safety-list { padding-top: 2px; }
.safety-foot {
  padding: 8px 14px 12px; font-size: 10.5px; color: var(--mist);
  line-height: 1.6;
}

/* Ask box */
.ask-box {
  margin: 10px 0 4px; padding: 12px 14px;
  border-radius: var(--radius);
  border: 1px solid var(--jade); background: var(--jade-soft);
}
.ask-hd {
  font-size: 12px; color: var(--jade);
  font-weight: 600; margin-bottom: 9px;
}
.ask-list { display: flex; flex-wrap: wrap; gap: 8px; }
.ask-chip {
  padding: 6px 12px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--jade); background: var(--surface);
  color: var(--jade); font-size: 12.5px; font-family: inherit;
  transition: all .15s;
}
.ask-chip:hover { background: var(--jade-soft); }

/* Status */
.status-line {
  display: flex; align-items: center; gap: 8px;
  color: var(--ink-soft); font-size: 13px; padding: 4px 0;
}
.dot-spinner { display: inline-flex; gap: 4px; }
.dot-spinner i {
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--jade);
  animation: blink 1.2s infinite both;
}
.dot-spinner i:nth-child(2) { animation-delay: .2s; }
.dot-spinner i:nth-child(3) { animation-delay: .4s; }
@keyframes blink {
  0%,80%,100% { opacity: .2; }
  40% { opacity: 1; }
}
.cursor-blink {
  display: inline-block; width: 8px; height: 16px;
  background: var(--jade); border-radius: 2px;
  vertical-align: -3px; margin-left: 2px;
  animation: blink 1s infinite;
}

/* Input */
#input-zone {
  padding: 10px 24px 18px; background: var(--paper);
  border-top: 1px solid var(--hairline);
}
#input-box {
  max-width: 820px; margin: 0 auto;
  border: 1px solid var(--hairline);
  border-radius: var(--radius);
  background: var(--surface); padding: 12px 14px;
  transition: border-color .15s;
}
#input-box:focus-within { border-color: var(--jade); }
#input-box textarea {
  width: 100%; border: none; outline: none; resize: none;
  font-size: 14.5px; font-family: inherit; line-height: 1.6;
  max-height: 160px; background: transparent; color: var(--ink);
}
#input-box textarea::placeholder { color: var(--mist); }
#input-foot {
  display: flex; justify-content: space-between;
  align-items: center; margin-top: 8px;
}
#hint { font-size: 11.5px; color: var(--mist); }
#btn-send {
  border: none; background: var(--vermillion); color: #fff;
  border-radius: var(--radius-sm); padding: 7px 18px;
  font-size: 13.5px; cursor: pointer; font-family: inherit;
  font-weight: 600; transition: background .15s;
}
#btn-send:hover:not(:disabled) { background: #8B2A1A; }
#btn-send:disabled { background: #CCC; cursor: not-allowed; }

#ai-notice {
  max-width: 820px; margin: 8px auto 0; text-align: center;
  font-size: 11px; color: var(--mist);
}

/* Toast */
#toast {
  position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
  background: var(--ink); color: #fff;
  padding: 9px 20px; border-radius: var(--radius);
  font-size: 13px; display: none; z-index: 999;
}

/* Scrollbar */
::-webkit-scrollbar { width: 7px; }
::-webkit-scrollbar-thumb {
  background: var(--hairline); border-radius: 999px;
}
::-webkit-scrollbar-thumb:hover { background: #C8BDAF; }
</style>
</head>
<body>

<div id="toast"></div>

<aside id="sidebar">
  <div class="side-head">

<script src="/static/chat-controls.js"></script>
<script>
/* 全局状态 */
let convs = [];
let activeId = null;
let generating = false;
let manageMode = false;
let selected = new Set();

const $ = s => document.querySelector(s);
const chatInner = $('#chat-inner'), chatScroll = $('#chat-scroll');
const input = $('#input'), btnSend = $('#btn-send');
const chatControls = new ChatControls(input, btnSend);

/* 工具 */
function toast(text, ms = 2200) {
  const t = $('#toast');
  t.textContent = text; t.style.display = 'block';
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.style.display = 'none', ms);
}

function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function copyText(text) {
  const done = () => toast('已复制到剪贴板');
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}
function fallbackCopy(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch (e) { toast('复制失败'); }
  ta.remove();
}

function md(text) {
  const lines = esc(text).split('\n');
  let html = '', inUl = false;
  const inline = t => t
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/`([^`]+)`/g, '<code style="background:#f2f4f8;border-radius:4px;padding:1px 5px;font-size:13px">$1</code>');
  for (let ln of lines) {
    const s = ln.trim();
    if (/^[-•*]\s+/.test(s)) {
      if (!inUl) { html += '<ul>'; inUl = true; }
      html += '<li>' + inline(s.replace(/^[-•*]\s+/, '')) + '</li>';
    } else {
      if (inUl) { html += '</ul>'; inUl = false; }
      if (!s) { continue; }
      else if (/^#{1,4}\s/.test(s)) html += '<h3>' + inline(s.replace(/^#{1,4}\s/, '')) + '</h3>';
      else html += '<p>' + inline(s) + '</p>';
    }
  }
  if (inUl) html += '</ul>';
  return html;
}

function scrollBottom() { chatScroll.scrollTop = chatScroll.scrollHeight; }

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.status);
  return r.json();
}

/* 多选批量删除 */
function setManageMode(on) {
  manageMode = on;
  selected.clear();
  document.body.classList.toggle('manage-mode', on);
  $('#btn-manage').style.display = on ? 'none' : 'block';
  updateBatchBar();
  renderConvs();
}
function updateBatchBar() {
  $('#btn-batch-del').textContent = `删除所选（${selected.size}）`;
  $('#btn-batch-del').disabled = selected.size === 0;
}
$('#btn-manage').addEventListener('click', () => setManageMode(true));
$('#btn-cancel-manage').addEventListener('click', () => setManageMode(false));
$('#btn-batch-del').addEventListener('click', async () => {
  if (!selected.size) return;
  if (!confirm(`删除所选 ${selected.size} 个对话？不可恢复。`)) return;
  await api('/api/conversations/delete-batch', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ids: [...selected]})
  });
  if (selected.has(activeId)) { activeId = null; renderChatArea(); }
  toast(`已删除 ${selected.size} 个对话`);
  setManageMode(false);
  loadConvs();
});

/* 侧栏：会话列表渲染 + 增删改 */
async function loadConvs() {
  convs = await api('/api/conversations');
  renderConvs();
}

function renderConvs() {
  document.querySelectorAll('.conv-item').forEach(e => e.remove());
  const pinned = convs.filter(c => c.pinned), recent = convs.filter(c => !c.pinned);
  $('#label-pinned').style.display = pinned.length ? 'block' : 'none';
  $('#label-recent').style.display = recent.length ? 'block' : 'none';
  const list = $('#conv-list');
  for (const c of pinned.concat(recent)) {
    list.appendChild(convNode(c));
  }
}

function convNode(c) {
  const div = document.createElement('div');
  div.className = 'conv-item' + (c.id === activeId ? ' active' : '');
  div.dataset.id = c.id;
  div.innerHTML = `
    <label class="sel-box"><input type="checkbox" ${selected.has(c.id) ? 'checked' : ''}></label>
    ${c.pinned ? '<span class="pin-ico">📌</span>' : ''}
    <span class="conv-title">${esc(c.title)}</span>
    <span class="conv-ops">
      <button class="pin" title="${c.pinned ? '取消置顶' : '置顶'}">${c.pinned ? '📍' : '📌'}</button>
      <button class="ren" title="重命名">✏️</button>
      <button class="del" title="删除">🗑️</button>
    </span>`;
  div.addEventListener('click', e => {
    if (e.target.closest('.conv-ops')) return;
    if (manageMode) {
      if (!e.target.closest('.sel-box')) {
        const cb = div.querySelector('.sel-box input');
        cb.checked = !cb.checked;
      }
      const on = div.querySelector('.sel-box input').checked;
      on ? selected.add(c.id) : selected.delete(c.id);
      updateBatchBar();
      return;
    }
    if (generating) { toast('请等待当前回答完成'); return; }
    openConv(c.id);
  });
  div.querySelector('.pin').addEventListener('click', async () => {
    await api(`/api/conversations/${c.id}`, {
      method: 'PATCH',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({pinned: !c.pinned})
    });
    loadConvs();
  });
  div.querySelector('.ren').addEventListener('click', () => startRename(div, c));
  div.querySelector('.del').addEventListener('click', async () => {
    if (!confirm(`删除对话「${c.title}」？此操作不可恢复。`)) return;
    await api(`/api/conversations/${c.id}`, {method: 'DELETE'});
    if (activeId === c.id) { activeId = null; renderChatArea(); }
    loadConvs();
  });
  return div;
}

function startRename(div, c) {
  const titleEl = div.querySelector('.conv-title');
  const old = c.title;
  titleEl.outerHTML = `<input class="rename-input" value="${esc(old)}">`;
  const inp = div.querySelector('.rename-input');
  inp.focus(); inp.select();
  const finish = async save => {
    const v = inp.value.trim();
    if (save && v && v !== old) {
      await api(`/api/conversations/${c.id}`, {
        method: 'PATCH', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({title: v.slice(0, 40)})
      });
    }
    loadConvs();
  };
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter') finish(true);
    if (e.key === 'Escape') finish(false);
    e.stopPropagation();
  });
  inp.addEventListener('blur', () => finish(true));
}

/* 主区：消息渲染 */
function renderChatArea() {
  chatInner.innerHTML = '';
  chatInner.appendChild(buildWelcome());
}

function buildWelcome() {
  const w = document.createElement('div');
  w.id = 'welcome';
  w.innerHTML = `
    <div class="big-logo">素</div>
    <h1>中医养生科普助手</h1>
    <p>我可以结合《黄帝内经》与体质养生资料回答问题，支持多轮追问，回答附引用来源。</p>
    <button id="agent-entry">
      <span class="ico">🧭</span>
      <span><div class="t1">体质辨识问诊</div><div class="t2">27 道题测出你的九种体质倾向，并生成专属调养建议</div></span>
      <span class="go">›</span>
    </button>
    <div class="samples">
      <button class="sample">阳虚体质有什么表现？</button>
      <button class="sample">春天应该怎么养生？</button>
      <button class="sample">《黄帝内经》里关于睡眠有什么论述？</button>
      <button class="sample">四季起居各有什么讲究？</button>
    </div>`;
  w.querySelector('#agent-entry').addEventListener('click', () => location.href = '/agent');
  w.querySelectorAll('.sample').forEach(button =>
    button.addEventListener('click', () => send(button.textContent)));
  return w;
}

function addUserMsg(text) {
  const d = document.createElement('div');
  d.className = 'msg-user';
  d.innerHTML = `<div class="bubble">${esc(text)}</div>
    <span class="msg-ops"><button class="copy">复制</button></span>`;
  d.querySelector('.copy').addEventListener('click', () => copyText(text));
  chatInner.appendChild(d); scrollBottom();
}

function addAiShell() {
  const d = document.createElement('div');
  d.className = 'msg-ai';
  d.innerHTML = `
    <div class="avatar">素</div>
    <div class="body">
      <details class="think" open>
        <summary><span class="chev">▶</span>💭 思考过程（检索与改写）</summary>
        <div class="think-body"><div class="trace"></div></div>
      </details>
      <div class="status-line">
        <span class="dot-spinner"><i></i><i></i><i></i></span>
        <span class="status-text">正在理解问题…</span>
      </div>
      <div class="safety-slot"></div>
      <div class="ask-slot"></div>
      <div class="content"></div>
    </div>`;
  chatInner.appendChild(d); scrollBottom();
  return d;
}

function traceLine(el, html) {
  if (!el) return;
  const d = document.createElement('div');
  d.className = 'ln';
  d.innerHTML = html;
  el.appendChild(d); scrollBottom();
}
function finishThink(shell, hasContent) {
  const box = shell.querySelector('details.think');
  if (!box) return;
  if (!hasContent) { box.remove(); return; }
  box.removeAttribute('open');
  box.querySelector('summary').innerHTML =
    '<span class="chev">▶</span>💭 思考过程（已折叠 · 点击展开）';
}

function attachCopy(msgDiv, rawText) {
  const ops = document.createElement('div');
  ops.className = 'msg-ops';
  ops.innerHTML = `<button class="copy">复制</button>`;
  ops.querySelector('.copy').addEventListener('click', () => copyText(rawText));
  msgDiv.querySelector('.body').appendChild(ops);
}

function sourcesHtml(sources) {
  if (!sources || !sources.length) return '';
  const items = sources.map(s => {
    const lv = s.credibility || '';
    const cred = (lv === 'background' || lv === 'reject')
      ? `<span class="cred ${lv}">${esc(s.credibility_label || (lv === 'reject' ? '不可采信' : '仅作文化背景'))}</span>`
      : '';
    return `
    <div class="src">
      <span class="name">📄 ${esc(s.source)} · ${esc(s.chapter || '')}</span>${cred}
      <span class="score">${s.score}</span>
    </div>`;
  }).join('');
  return `
    <details class="sources-box">
      <summary>📚 引用来源（${sources.length}）</summary>
      <div class="src-list">${items}</div>
    </details>`;
}

/* 安全判读卡 */
const LV_TEXT = {high: '高风险', medium: '需注意', info: '提示'};
const TIER_TEXT = {forbid: '明确禁止', confirm: '需专业确认',
                   not_needed: '不建议（无适应症）',
                   conditional: '对证但有条件', ok: '可执行'};
const GAP_LABEL = {
  age_sex: '年龄与性别', tongue: '舌象', stool_urine: '二便',
  cold_heat: '寒热', medication: '在服用的药物',
  chronic: '已知慢病', chief_time: '主诉时间线',
  anticoag_use: '是否在服抗凝/抗血小板药',
  bleeding: '出血倾向', cardiac_history: '心脏/支架病史', menopause: '月经与更年期情况',
};
const SCREEN_SAY = {
  fatigue_cold_midlife_woman: '先做一组基础检查，把"看着像亚健康、其实是疾病"的情况排掉',
  hypertension: '降压药不能停、不能自行减量；食疗中药不能替代降压药；每天记血压',
  diabetes: '降糖药不能自行停；含糖补品要计入总热量',
  thyroid: '按医嘱复查 TSH/FT4；左甲状腺素清晨空腹服，与钙铁/豆制品/中药隔开 4 小时',
  ambiguous_damp: '同样的"湿"，寒湿/湿热/脾虚湿困调法相反，需靠舌苔与二便区分',
};
const SCREEN_NAME = {
  fatigue_cold_midlife_woman: '甲功 / 血常规 / 血糖血脂 / 肝肾功能',
  hypertension: '血压监测与复查', diabetes: '血糖管理与复查',
  thyroid: '甲功复查', ambiguous_damp: '湿证鉴别（面诊看舌）',
};
function mdLite(s) {
  return esc(s).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/\n+/g, '<br>');
}

function safetyHtml(ev) {
  if (!ev) return '';
  const allHits = ev.hits || [];
  const conflicts = ev.conflicts || [];
  const screening = ev.screening || [];
  const gaps = ev.gaps || [];
  if (!allHits.length && !conflicts.length && !ev.subject_switch) return '';

  const hits = allHits.filter(h => (h.origin || 'message') === 'message');
  const profHits = allHits.filter(h => h.origin === 'profile');

  let level = 'info';
  for (const h of allHits) {
    if (h.tier === 'forbid') level = 'high';
    else if ((h.tier === 'confirm' || h.tier === 'not_needed'
              || h.tier === 'conditional') && level !== 'high') level = 'medium';
    if (h.level === 'high') level = 'high';
    else if (h.level === 'medium' && level === 'info') level = 'medium';
  }

  const hitsHtml = hits.map(h => {
    const tier = h.tier || '';
    const cls = tier ? `tier-${tier}` : (h.level || 'info');
    const tname = h.tier_label || TIER_TEXT[tier] || '';
    const badges = [tname
      ? `<span class="badge ${cls}">${esc(tname)}</span>`
      : `<span class="badge ${h.level || 'info'}">${LV_TEXT[h.level] || h.level || ''}</span>`];
    if (h.taking) badges.push('<span class="badge high">你在服用</span>');
    if (h.escalated) badges.push('<span class="badge high">与你的情况相关</span>');
    for (const t of (h.tag_labels || [])) badges.push(`<span class="badge tag">${esc(t)}</span>`);

    const why = h.why ? `<div class="why">${esc(h.why)}</div>` : '';
    const notfor = h.not_for ? `<div class="notfor">⚠️ 不适合：${esc(h.not_for)}</div>` : '';
    const conds = h.tier_basis
      ? `<div class="cond">📌 档位依据：<b>${esc(h.tier_basis)}</b></div>`
      : ((h.cond_labels || []).length
        ? `<div class="cond">🔎 档位依据（你命中了）：<b>${h.cond_labels.map(esc).join('、')}</b></div>` : '');
    const pend = (h.unassessed_gaps || []).length
      ? `<div class="pending">⏳ 结论已挂起：还差 <b>${
          h.unassessed_gaps.map(g => esc(GAP_LABEL[g] || g)).join('、')}</b>——答一下就能定，不用先买来试</div>` : '';
    const body = (h.reading || h.verdict || '').trim();
    const reading = body
      ? `<div class="reading ${tier ? 't-' + tier : ''}">⚖️ 所以对你而言：${mdLite(body)}</div>` : '';
    return `<div class="safety-item">
      <div class="hd"><span class="nm">${esc(h.name)}</span>${badges.join('')}</div>
      ${why}${notfor}${conds}${pend}${reading}
    </div>`;
  }).join('');

  const conflictHtml = conflicts.length ? `
    <div class="safety-sub">⚠️ 档案一致性提醒（需你复核）</div>
    <div class="safety-list">${conflicts.map(c =>
      `<div class="safety-item">
        <div class="why">${esc(c.detail || '')}</div>
        <div class="notfor">处理：${esc(c.action || '建议复核体质判定')}</div>
      </div>`).join('')}</div>` : '';

  const screenHtml = screening.length ? `
    <div class="safety-sub">🩺 建议到院排查（西医）</div>
    <div class="safety-list">${screening.map(k =>
      `<div class="safety-item">
        <div class="why"><b>${esc(SCREEN_NAME[k] || '相关检查')}</b>：${esc(SCREEN_SAY[k] || '')}</div>
      </div>`).join('')}</div>` : '';

  const hasChips = !!(ev.questions && ev.questions.length);
  const gapHtml = (gaps.length && !hasChips) ? `
    <div class="safety-sub">❓ 还需向你确认（信息不足，先不给具体方药）</div>
    <div class="safety-list">${gaps.map(g =>
      `<div class="safety-item"><div class="why">· 缺 ${esc(GAP_LABEL[g] || g)}</div></div>`
      ).join('')}</div>` : '';

  const profHtml = profHits.length ? `
    <details class="sources-box prof-box">
      <summary>📒 来自你档案的提醒（${profHits.length}）——本轮没提到，仅顺带确认</summary>
      <div class="safety-list">${profHits.map(h => {
        const t = h.taking ? '（在服）' : '';
        const tg = h.tier_label ? `[${h.tier_label}] ` : '';
        const v = ((h.reading || h.verdict || h.why || '') + '').replace(/\*\*/g, '');
        return `<div class="safety-item"><div class="why">· <b>${esc(h.name)}</b>${t}：${esc(tg)}${esc(v.length > 90 ? v.slice(0, 90) + '…' : v)}</div></div>`;
      }).join('')}</div>
    </details>` : '';

  const stopHtml = ev.stop ? `
    <div class="safety-stop">⛔ 建议暂停自行服用上述涉及的中药 / 食疗，
      先与中医师或药师确认；正在服用的西药（如降压药）请勿自行停减。</div>` : '';

  const sw = ev.subject_switch_detail || null;
  const swWhere = sw && sw.prev_label
    ? `（前面偏「${esc(sw.prev_label)}」，这次偏「${esc(sw.cur_label || '')}」；依据：${esc(sw.where || '本会话记录')}）`
    : '';
  const switchHtml = ev.subject_switch ? `
    <div class="safety-switch">🔄 <b>先确认一件事</b>：你这次说的，与<b>本次对话前面</b>提到的方向相反${swWhere}。
      <br>在确认之前，我<b>不把前面的记录当成对你的判断依据</b>——这些是在说你自己的新情况吗？
      如果是替别人问（家人 / 朋友），请重新描述「要看的那个人」的情况；他没说过的，我不会拿来当他的事实。</div>` : '';

  const states = ev.states || [];
  const statesHtml = states.length ? `
    <div class="safety-states">🔺 <b>你的状态约束（本轮优先级最高）</b>：
      ${states.map(s => `<b>${esc(s.label || s.key || '')}</b>${s.note ? '——' + esc(s.note) : ''}`).join('；')}
      <br>以上几条先于任何"某味药能不能吃"的判断生效；涉及用药请一并告知医师。</div>` : '';

  const cntBits = [];
  const tally = {};
  for (const h of hits) if (h.tier) tally[h.tier] = (tally[h.tier] || 0) + 1;
  const tierBits = ['forbid', 'confirm', 'not_needed', 'conditional', 'ok']
    .filter(t => tally[t]).map(t => `${TIER_TEXT[t]} ${tally[t]}`);
  if (tierBits.length) cntBits.push(tierBits.join('｜'));
  if (hits.length) cntBits.push(`本轮命中 ${hits.length} 项`);
  if (profHits.length) cntBits.push(`档案提醒 ${profHits.length} 项`);
  return `<div class="safety-card ${level}">
    <div class="safety-head"><span>🛡️ 安全判读</span>
      <span class="cnt">${cntBits.join(' · ') || '无命中'} · 由规则库强制给出，不依赖资料库检索</span></div>
    ${switchHtml}${statesHtml}${stopHtml}
    ${hits.length ? `<div class="safety-list">${hitsHtml}</div>` : ''}
    ${profHtml}${conflictHtml}${screenHtml}${gapHtml}
    <div class="safety-foot">五档处置：明确禁止 ｜ 需专业确认 ｜ 不建议（无适应症）｜ 对证但有条件 ｜ 可执行——
      档位由「这个东西 × 你的具体情况」共同决定，同一味药换个人、换个证型结论就不同。
      「明确禁止」是"对你有害"，「不建议」只是"对你没用、不必吃"，两者别混。
      以上为通用安全判读，不构成诊断；具体用药与停减请遵医嘱。</div>
  </div>`;
}

function questionsHtml(items) {
  if (!items || !items.length) return '';
  return `<div class="ask-box">
    <div class="ask-hd">❓ 先跟你确认几件事（信息补全了我才能给针对你的建议）— 点一下填进输入框</div>
    <div class="ask-list">${items.map(q =>
      `<button class="ask-chip" title="${esc(q.ask || '')}" data-label="${esc(q.label || '')}">${esc(q.label || '')}</button>`
    ).join('')}</div>
  </div>`;
}
document.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('.ask-chip');
  if (!b) return;
  const label = b.getAttribute('data-label') || '';
  const prefix = `【${label}】我的情况是：`;
  input.value = (input.value.trim() ? input.value.trim() + '\n' : '') + prefix;
  autoGrow();
  input.focus();
  input.setSelectionRange(input.value.length, input.value.length);
});

async function openConv(id) {
  activeId = id;
  renderConvs();
  chatInner.innerHTML = '';
  const msgs = await api(`/api/conversations/${id}/messages`);
  if (!msgs.length) {
    renderChatArea();
    return;
  }
  for (const m of msgs) {
    if (m.role === 'user') {
      addUserMsg(m.content);
    } else {
      const d = document.createElement('div');
      d.className = 'msg-ai';
      d.innerHTML = `
        <div class="avatar">素</div>
        <div class="body">${safetyHtml(m.safety)}${md(m.content)}${sourcesHtml(m.sources)}
          ${questionsHtml((m.safety || {}).questions)}</div>`;
      chatInner.appendChild(d);
      attachCopy(d, m.content);
    }
  }
  scrollBottom();
}

/* 新建对话 & 发送（SSE 流式）*/
$('#agent-entry').addEventListener('click', () => location.href = '/agent');

$('#btn-new').addEventListener('click', async () => {
  if (generating) { toast('请等待当前回答完成'); return; }
  const c = await api('/api/conversations', {
    method: 'POST', headers: {'Content-Type': 'application/json'}, body: '{}'
  });
  activeId = c.id;
  renderChatArea();
  input.value = '';
  autoGrow();
  await loadConvs();
  input.focus();
});

async function newConvIfNone() {
  if (activeId !== null) return activeId;
  const c = await api('/api/conversations', {
    method: 'POST', headers: {'Content-Type': 'application/json'}, body: '{}'
  });
  activeId = c.id;
  renderChatArea();
  return c.id;
}

async function send(message = input.value) {
  const text = message.trim();
  if (!text || generating) return;

  generating = true;
  chatControls.begin();
  input.placeholder = '正在回答中…';
  let shell = null;
  try {
    const convId = await newConvIfNone();
    chatControls.setConversation(convId);
    $('#welcome')?.remove();
    addUserMsg(text);
    shell = addAiShell();
    const body = shell.querySelector('.body');
    const statusText = shell.querySelector('.status-text');
    const trace = shell.querySelector('.trace');
    const thinkBox = shell.querySelector('details.think');
    let answer = '', sources = null;

    const resp = await fetch(`/api/conversations/${convId}/chat`, {
      method: 'POST',
      signal: chatControls.signal,
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: text})
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);

    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      let idx;
      while ((idx = buf.indexOf('\n\n')) >= 0) {
        const frame = buf.slice(0, idx); buf = buf.slice(idx + 2);
        if (!frame.startsWith('data: ')) continue;
        const ev = JSON.parse(frame.slice(6));
        if (ev.type === 'standalone') {
          statusText.textContent = '正在检索资料…';
        } else if (ev.type === 'reflection') {
          for (const a of ev.attempts || []) {
            const cls = a.accepted ? 'hit' : 'miss';
            traceLine(trace, `<span>🔍 检索第${a.round}轮 top1=<b class="${cls}">${a.top_score}</b>` +
              `${a.accepted ? ' 命中' : ' 不足，改写查询重试'}</span><span class="q">「${esc(a.query)}」</span>`);
          }
          if (ev.reason) traceLine(trace, `<span>🧭 ${esc(ev.reason)}</span>`);
        } else if (ev.type === 'sources') {
          sources = ev.sources;
          statusText.textContent = '正在组织回答…';
        } else if (ev.type === 'safety') {
          const slot = shell.querySelector('.safety-slot');
          if (slot) slot.innerHTML = safetyHtml(ev);
          const askSlot = shell.querySelector('.ask-slot');
          if (askSlot && ev.questions && ev.questions.length) {
            askSlot.innerHTML = questionsHtml(ev.questions);
          }
          scrollBottom();
        } else if (ev.type === 'questions') {
          const askSlot = shell.querySelector('.ask-slot');
          if (askSlot) askSlot.innerHTML = questionsHtml(ev.items);
          scrollBottom();
        } else if (ev.type === 'delta') {
          answer += ev.text;
          statusText.parentElement.style.display = 'none';
          body.querySelector('.content').innerHTML =
            `<p>${md(answer)}<span class="cursor-blink"></span></p>`;
          scrollBottom();
        } else if (ev.type === 'error') {
          throw new Error(ev.text);
        } else if (ev.type === 'done') {
          statusText.parentElement.style.display = 'none';
          body.querySelector('.content').innerHTML =
            md(answer || ev.answer) + sourcesHtml(sources);
        }
      }
    }
    finishThink(shell, !!answer);
    attachCopy(shell, answer);
    scrollBottom();
    loadConvs();
  } catch (e) {
    if (chatControls.signal.aborted) {
      chatControls.showStopped(shell);
    } else {
      toast('出错了：' + e.message, 3500);
      shell?.remove();
    }
  } finally {
    generating = false;
    chatControls.finish();
    input.placeholder = '输入你的问题，Enter 发送，Shift+Enter 换行';
    input.focus();
  }
}

btnSend.addEventListener('click', () => generating ? chatControls.stop() : send());
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
function autoGrow() {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 160) + 'px';
}
input.addEventListener('input', autoGrow);

/* 启动 */
renderChatArea();
loadConvs();
</script>
</body>
</html>
